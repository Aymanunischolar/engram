[project]
name = "engram"
version = "0.1.0"
description = "Persistent, graph-native engineering memory for AI coding agents, built on cognee."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "cognee==1.4.1",
    "python-dotenv>=1.0.1",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pyyaml>=6.0.1",
    "fastapi>=0.116.2",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
